# Publica la web en GitHub Pages.
# Requiere Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # La llama update-data.yml tras subir datos nuevos: los push hechos con
  # GITHUB_TOKEN no disparan otros workflows, así que no basta con el trigger "push".
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Rama, no commit: cuando lo llama update-data.yml, incluye el commit de datos recién subido.
          ref: main

      - uses: actions/configure-pages@v5

      # Solo se publica lo que usa la web: fuera scripts/ (pipelines, review.html y los
      # datos de trabajo de Hair Color con los rechazados) y los archivos de desarrollo.
      - name: Build site
        run: |
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.gitattributes' \
            --exclude '.venv' \
            --exclude '_site' \
            --exclude 'scripts/' \
            --exclude 'README.md' \
            --exclude 'CLAUDE.md'
          find _site -type f | sort

      # Cache busting: GitHub Pages sirve todo con max-age=600, y sin esto el navegador podía
      # mezclar un HTML nuevo con CSS/JS/datos viejos (p. ej. un botón sin estilos ni listener).
      # Se añade ?v=<commit> a las referencias; si alguna no aparece, el despliegue falla.
      - name: Cache busting
        run: |
          v="$(git rev-parse --short=10 HEAD)"
          sed -i -E "s#(href=\"style\.css)\"#\1?v=$v\"#; s#(src=\"game\.js)\"#\1?v=$v\"#" _site/index.html _site/privacy.html
          sed -i -E "s#(url: 'data/[a-z]+\.json)'#\1?v=$v'#" _site/game.js
          grep -q "style.css?v=$v" _site/index.html
          grep -q "game.js?v=$v" _site/index.html
          grep -q "style.css?v=$v" _site/privacy.html
          test "$(grep -c "\.json?v=$v'" _site/game.js)" -eq 4
          grep -n "?v=$v" _site/index.html _site/privacy.html _site/game.js

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
