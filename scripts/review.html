<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revisión · Hair Color</title>
  <!--
    Galería local para revisar los candidatos de Hair Color (scripts/hair/candidates.json).
    No se publica: scripts/ queda fuera del despliegue.
    Uso, desde la raíz del repo:
      python -m http.server 8000
      abrir http://localhost:8000/scripts/review.html
    Aceptar/rechazar se guarda en este navegador. "Exportar review.json" descarga lo
    aprobado y lo rechazado; luego:
      python scripts/build_hair_colors.py --approve review.json
    Solo cambian los personajes que aparecen en el archivo: los pendientes siguen pendientes.
  -->
  <style>
    :root {
      --bg: #f7f3ee; --surface: #fffdf9; --fill: #efe9e1; --ink: #2b2622; --ink-2: #6f665e; --ink-3: #a1978c;
      --line: rgba(70, 50, 30, 0.08); --accent: #d9774b; --good: #3a9e68; --bad: #d9534a;
      --shadow: 0 1px 2px rgba(80, 55, 30, 0.05), 0 10px 30px rgba(80, 55, 30, 0.09);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1816; --surface: #25221f; --fill: #312d29; --ink: #f4eee7; --ink-2: #b8afa5; --ink-3: #7f766d;
        --line: rgba(255, 235, 210, 0.08); --accent: #ec916a; --good: #55bf86; --bad: #f0675e;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.3);
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header {
      position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
      padding: 14px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 19px; font-weight: 750; }
    .counts { display: flex; gap: 14px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
    .counts b { color: var(--ink); }
    .goal { font-weight: 600; }
    .goal.ok { color: var(--good); }
    .spacer { flex: 1; }
    .filters { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--fill); }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; }
    .filters button { padding: 6px 12px; border-radius: 999px; background: none; color: var(--ink-2); font-weight: 600; }
    .filters button.is-on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .primary { padding: 9px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 650; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 16px; padding: 20px; }
    @media (max-width: 520px) { main { grid-template-columns: 1fr; padding: 12px; } }
    .card { padding: 14px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
    .card.is-accepted { box-shadow: var(--shadow), inset 0 0 0 2px var(--good); }
    .card.is-rejected { opacity: 0.55; box-shadow: var(--shadow), inset 0 0 0 2px var(--bad); }
    .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .name { font-weight: 700; font-size: 16px; }
    .anime { color: var(--ink-3); font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .rank { margin-left: auto; color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
    .views { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .view { margin: 0; }
    .view canvas { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 12px; background: var(--fill); }
    .view figcaption { margin-top: 4px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); text-align: center; }
    .foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .swatch { flex: none; width: 38px; height: 38px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); }
    .meta { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; line-height: 1.35; }
    .meta b { color: var(--ink); font-family: ui-monospace, Consolas, monospace; }
    .actions { display: flex; gap: 6px; margin-left: auto; }
    .actions button { padding: 8px 14px; border-radius: 999px; background: var(--fill); font-weight: 650; }
    .is-accepted .accept { background: var(--good); color: #fff; }
    .is-rejected .reject { background: var(--bad); color: #fff; }
    .msg { padding: 40px 20px; text-align: center; color: var(--ink-2); }
    code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Hair Color · revisión</h1>
    <div class="counts">
      <span>Aprobados <b id="n-ok">0</b></span>
      <span>Rechazados <b id="n-bad">0</b></span>
      <span>Pendientes <b id="n-todo">0</b></span>
      <span class="goal" id="goal"></span>
    </div>
    <span class="spacer"></span>
    <div class="filters" id="filters">
      <button type="button" data-filter="all" class="is-on">Todos</button>
      <button type="button" data-filter="todo">Pendientes</button>
      <button type="button" data-filter="ok">Aprobados</button>
      <button type="button" data-filter="bad">Rechazados</button>
    </div>
    <button type="button" class="primary" id="export">Exportar review.json</button>
  </header>
  <main id="grid"><p class="msg">Cargando candidatos…</p></main>

  <script>
  (() => {
    'use strict';
    const STORAGE_KEY = 'hair-review';
    const GOAL = [60, 100];
    const $ = (id) => document.getElementById(id);

    // Decisiones de este navegador: { id: 'ok' | 'bad' | 'todo' }. Sin entrada, cuenta el
    // estado ya aplicado en candidates.json (aprobado, rechazado o pendiente).
    let decisions = {};
    try { decisions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { decisions = {}; }
    const persist = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions)); } catch {} };

    /* ---------- Color: sRGB <-> CIELAB (D65), igual que el pipeline ---------- */
    const lin = (c) => (c > 0.04045 ? ((c + 0.055) / 1.055) ** 2.4 : c / 12.92);
    const gam = (c) => (c > 0.0031308 ? 1.055 * c ** (1 / 2.4) - 0.055 : 12.92 * c);
    const fLab = (t) => (t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116);
    const fInv = (t) => (t ** 3 > 216 / 24389 ? t ** 3 : (116 * t - 16) / (24389 / 27));
    function rgbToLab(r, g, b) {
      r = lin(r / 255); g = lin(g / 255); b = lin(b / 255);
      const x = (0.4124564 * r + 0.3575761 * g + 0.1804375 * b) / 0.95047;
      const y = 0.2126729 * r + 0.7151522 * g + 0.0721750 * b;
      const z = (0.0193339 * r + 0.1191920 * g + 0.9503041 * b) / 1.08883;
      const fx = fLab(x), fy = fLab(y), fz = fLab(z);
      return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
    }
    function labToRgb(L, a, b) {
      const fy = (L + 16) / 116;
      const x = fInv(fy + a / 500) * 0.95047, y = fInv(fy), z = fInv(fy - b / 200) * 1.08883;
      const r = 3.2404542 * x - 1.5371385 * y - 0.4985314 * z;
      const g = -0.9692660 * x + 1.8760108 * y + 0.0415560 * z;
      const bl = 0.0556434 * x - 0.2040259 * y + 1.0572252 * z;
      return [r, g, bl].map((c) => Math.round(Math.min(1, Math.max(0, gam(Math.max(0, c)))) * 255));
    }

    const loadImage = (src) => new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error(`No se pudo cargar ${src}`));
      img.src = src;
    });

    // Dibuja original, máscara superpuesta y vista previa del recoloreado (claridad original + color objetivo).
    async function render(entry, [cOrig, cOver, cPrev]) {
      // Los rechazados ya aplicados no tienen máscara (se borró): solo se muestra la imagen.
      const [img, maskImg] = await Promise.all([loadImage(entry.image), entry.mask ? loadImage(`../${entry.mask}`) : null]);
      const w = img.naturalWidth, h = img.naturalHeight;
      for (const c of [cOrig, cOver, cPrev]) { c.width = w; c.height = h; }
      const ctx = cOrig.getContext('2d');
      ctx.drawImage(img, 0, 0);
      if (!maskImg) return;
      const src = ctx.getImageData(0, 0, w, h);

      const mctx = cOver.getContext('2d');
      mctx.drawImage(maskImg, 0, 0, w, h);
      const mask = mctx.getImageData(0, 0, w, h).data;

      const over = new ImageData(w, h);
      const prev = new ImageData(w, h);
      const [, ta, tb] = entry.lab;
      const d = src.data;
      for (let i = 0; i < d.length; i += 4) {
        const m = mask[i] / 255;
        // superposición: magenta sobre el pelo
        over.data[i] = d[i] * (1 - 0.65 * m) + 255 * 0.65 * m;
        over.data[i + 1] = d[i + 1] * (1 - 0.65 * m);
        over.data[i + 2] = d[i + 2] * (1 - 0.65 * m) + 200 * 0.65 * m;
        over.data[i + 3] = 255;
        // vista previa: en el pelo, misma L y croma del color objetivo
        let [r, g, b] = [d[i], d[i + 1], d[i + 2]];
        if (m > 0.01) {
          const [L] = rgbToLab(r, g, b);
          const [nr, ng, nb] = labToRgb(L, ta, tb);
          r = r + (nr - r) * m; g = g + (ng - g) * m; b = b + (nb - b) * m;
        }
        prev.data[i] = r; prev.data[i + 1] = g; prev.data[i + 2] = b; prev.data[i + 3] = 255;
      }
      mctx.putImageData(over, 0, 0);
      cPrev.getContext('2d').putImageData(prev, 0, 0);
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    let entries = [];
    let filter = 'all';
    const cards = new Map();

    const FILE_STATE = { approved: 'ok', rejected: 'bad', pending: 'todo' };
    let fileState = {};
    function stateOf(id) { return decisions[id] || fileState[id] || 'todo'; }

    function updateCard(id) {
      const card = cards.get(id);
      const s = stateOf(id);
      card.classList.toggle('is-accepted', s === 'ok');
      card.classList.toggle('is-rejected', s === 'bad');
      card.hidden = filter !== 'all' && filter !== s;
    }

    function updateCounts() {
      const n = { ok: 0, bad: 0, todo: 0 };
      for (const e of entries) n[stateOf(e.id)]++;
      $('n-ok').textContent = n.ok;
      $('n-bad').textContent = n.bad;
      $('n-todo').textContent = n.todo;
      const goal = $('goal');
      goal.textContent = `Objetivo ${GOAL[0]}–${GOAL[1]}`;
      goal.classList.toggle('ok', n.ok >= GOAL[0] && n.ok <= GOAL[1]);
    }

    function decide(id, value) {
      decisions[id] = stateOf(id) === value ? 'todo' : value;
      persist();
      updateCard(id);
      updateCounts();
    }

    function buildCard(entry, index) {
      const card = el('article', 'card');
      const head = el('div', 'head');
      head.append(el('span', 'name', entry.name), el('span', 'anime', entry.anime || ''), el('span', 'rank', `#${index + 1}`));

      const views = el('div', 'views');
      const canvases = ['Original', 'Máscara', 'Vista previa'].map((label) => {
        const fig = el('figure', 'view');
        const canvas = el('canvas');
        fig.append(canvas, el('figcaption', null, label));
        views.append(fig);
        return canvas;
      });

      const foot = el('div', 'foot');
      const swatch = el('div', 'swatch');
      swatch.style.background = entry.hex;
      const meta = el('div', 'meta');
      meta.append(el('b', null, entry.hex), el('br'),
        `Lab ${entry.lab.map((v) => v.toFixed(1)).join(' / ')} · ${Math.round(entry.coverage * 100)} % pelo`
        + (entry.mask ? '' : ' · máscara borrada (aprobar y volver a ejecutar el script la regenera)'));
      const actions = el('div', 'actions');
      const accept = el('button', 'accept', 'Aceptar');
      const reject = el('button', 'reject', 'Rechazar');
      accept.type = reject.type = 'button';
      accept.addEventListener('click', () => decide(entry.id, 'ok'));
      reject.addEventListener('click', () => decide(entry.id, 'bad'));
      actions.append(accept, reject);
      foot.append(swatch, meta, actions);

      card.append(head, views, foot);
      card._render = () => render(entry, canvases).catch((err) => {
        card.querySelector('.views').replaceWith(el('p', 'msg', err.message));
      });
      return card;
    }

    // Solo se procesan las tarjetas que llegan a verse.
    const observer = new IntersectionObserver((items) => {
      for (const item of items) {
        if (!item.isIntersecting) continue;
        observer.unobserve(item.target);
        item.target._render();
      }
    }, { rootMargin: '600px' });

    async function init() {
      const grid = $('grid');
      try {
        const res = await fetch('hair/candidates.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        entries = await res.json();
      } catch (err) {
        grid.innerHTML = '';
        grid.append(el('p', 'msg', `No se pudo leer scripts/hair/candidates.json (${err.message}). Sirve el repo con "python -m http.server" y abre /scripts/review.html.`));
        return;
      }
      fileState = Object.fromEntries(entries.map((e) => [e.id, FILE_STATE[e.status] || 'todo']));

      grid.replaceChildren();
      entries.forEach((entry, i) => {
        const card = buildCard(entry, i);
        cards.set(entry.id, card);
        grid.append(card);
        updateCard(entry.id);
        observer.observe(card);
      });
      updateCounts();
    }

    $('filters').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      filter = btn.dataset.filter;
      for (const b of $('filters').children) b.classList.toggle('is-on', b === btn);
      for (const e of entries) updateCard(e.id);
    });

    $('export').addEventListener('click', () => {
      const pick = (state) => entries.filter((e) => stateOf(e.id) === state).map((e) => e.id);
      const review = { approved: pick('ok'), rejected: pick('bad') };
      const blob = new Blob([JSON.stringify(review)], { type: 'application/json' });
      const a = el('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'review.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    init();
  })();
  </script>
</body>
</html>
